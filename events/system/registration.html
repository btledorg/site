<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTLED | Student Registration Form</title>
  <link rel="icon" type="image/png" href="../../resources/image/logo/2.png" />
  <link rel="stylesheet" href="../../resources/css/landing.css" />
  <link rel="stylesheet" href="../../resources/css/form.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }

    .banner {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px 12px 0 0;
      padding: 1.5rem;
      max-width: 720px;
      width: 100%;
      text-align: center;
      border-bottom: none;
    }

    .banner img {
      max-width: 100%;
      height: auto;
    }

    .registration-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      flex-direction: column;
    }

    .registration-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 0 12px 12px;
      padding: 2.25rem;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .auth-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    @media (max-width: 640px) {
      .auth-row { flex-direction: column; gap: 0; }
    }

    .auth-form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }

    .auth-form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
    }

    .auth-form-group input, 
    .auth-form-group select {
      padding: 0.75rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-form-group input:focus, 
    .auth-form-group select:focus {
      border-color: #0047AB;
      box-shadow: 0 0 0 3px rgba(0, 71, 171, 0.12);
    }

    .sig-box-wrapper {
      position: relative;
      margin-top: 0.25rem;
    }

    #reg-sig-canvas {
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      width: 100%;
      height: 160px;
      background: #f8fafc;
      cursor: crosshair;
      touch-action: none;
      box-sizing: border-box;
      display: block;
    }

    .clear-sig-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .clear-sig-btn:hover { background: #cbd5e1; }

    .auth-btn {
      width: 100%;
      padding: 0.9rem;
      background: #0047AB;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }

    .auth-btn:hover { background: #00337d; }
    .auth-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .auth-alert {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      display: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .auth-alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
    .auth-alert.success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; display: block; }
  </style>
</head>
<body>

  <main class="registration-wrapper">
    <div class="banner">
      <img src="../../resources/image/banner/formbanner.png" alt="BTLED Logo"/>
    </div>

    <div id="registration-view" class="registration-card">
      <span class="card-header-badge">Member Registration</span>
      <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 0.25rem;">Complete Student Profile</h2>
      <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem;">
        Fill out your personal and academic information below to register your official student record.
      </p>

      <div id="reg-alert" class="auth-alert"></div>

      <form id="register-form">
        <div class="auth-row">
          <div class="auth-form-group">
            <label for="reg-id">Student No.</label>
            <input type="text" id="reg-id" required placeholder="e.g., C2026-0001" autofocus />
          </div>
          <div class="auth-form-group">
            <label for="reg-program">Program & Section</label>
            <input type="text" id="reg-program" required placeholder="e.g., BTLED-IA 2A" />
          </div>
        </div>

        <div class="auth-row">
          <div class="auth-form-group">
            <label for="reg-name">First Name</label>
            <input type="text" id="reg-name" required placeholder="First Name" />
          </div>
          <div class="auth-form-group">
            <label for="reg-surname">Surname</label>
            <input type="text" id="reg-surname" required placeholder="Surname" />
          </div>
        </div>

        <div class="auth-row">
          <div class="auth-form-group">
            <label for="reg-mname">Middle Name</label>
            <input type="text" id="reg-mname" placeholder="Middle Name (Optional)" />
          </div>
          <div class="auth-form-group">
            <label for="reg-sex">Sex</label>
            <select id="reg-sex" required>
              <option value="">Select Sex</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="reg-bdate">Birthdate</label>
          <input type="date" id="reg-bdate" required />
        </div>

        <div class="auth-row">
          <div class="auth-form-group">
            <label for="reg-street">Street / Barangay</label>
            <input type="text" id="reg-street" required placeholder="Street / Brgy" />
          </div>
          <div class="auth-form-group">
            <label for="reg-city">Municipality / City</label>
            <input type="text" id="reg-city" required placeholder="City / Municipality" />
          </div>
        </div>

        <div class="auth-row">
          <div class="auth-form-group">
            <label for="reg-prov">Province</label>
            <input type="text" id="reg-prov" required placeholder="Province" />
          </div>
          <div class="auth-form-group">
            <label for="reg-contact">Contact Number</label>
            <input type="tel" id="reg-contact" required placeholder="09XXXXXXXXX" />
          </div>
        </div>

        <div class="auth-form-group">
          <label for="reg-email">E-mail Address</label>
          <input type="email" id="reg-email" required placeholder="email@example.com" />
        </div>

        <!-- Digital Signature Field -->
        <div class="auth-form-group">
          <label>Digital Signature <span style="color:#dc2626">*</span></label>
          <div class="sig-box-wrapper">
            <canvas id="reg-sig-canvas" width="600" height="200"></canvas>
            <button type="button" class="clear-sig-btn" onclick="clearRegSignature()">Clear</button>
          </div>
        </div>

        <!-- Honeypot field for bot protection -->
        <div style="display: none" aria-hidden="true">
          <input type="text" id="reg-website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="reg-btn" class="auth-btn">
          <span>Submit Registration</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0yXSNWkVCPjNGn9fFT4HRkKLgh7CJnNek604Be08n-oY3PaEDJZIapCGZlvxrvJE/exec";

    // 1. BroadcastChannel for same-device cross-tab communication
    const tapChannel = new BroadcastChannel("btled_tap_channel");

    // 2. PeerJS Setup (Restored)
    const targetPeerId = new URLSearchParams(window.location.search).get("peer");
    let peer = null, conn = null;

    if (targetPeerId) {
      peer = new Peer();
      peer.on("open", () => {
        conn = peer.connect(targetPeerId);
      });
    }

    /* ---------- Signature Pad Logic ---------- */
    const sigCanvas = document.getElementById("reg-sig-canvas");
    const sigCtx = sigCanvas.getContext("2d");
    let isDrawing = false, hasSigned = false;

    sigCtx.lineWidth = 3;
    sigCtx.lineCap = "round";
    sigCtx.lineJoin = "round";
    sigCtx.strokeStyle = "#0047AB";

    function getCanvasPos(e) {
      const rect = sigCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (sigCanvas.width / rect.width),
        y: (clientY - rect.top) * (sigCanvas.height / rect.height)
      };
    }

    function startDraw(e) {
      isDrawing = true;
      hasSigned = true;
      const p = getCanvasPos(e);
      sigCtx.beginPath();
      sigCtx.moveTo(p.x, p.y);
      e.preventDefault();
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getCanvasPos(e);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();
      e.preventDefault();
    }

    function stopDraw() { isDrawing = false; }

    sigCanvas.addEventListener("mousedown", startDraw);
    sigCanvas.addEventListener("mousemove", draw);
    sigCanvas.addEventListener("mouseup", stopDraw);
    sigCanvas.addEventListener("mouseleave", stopDraw);
    sigCanvas.addEventListener("touchstart", startDraw, { passive: false });
    sigCanvas.addEventListener("touchmove", draw, { passive: false });
    sigCanvas.addEventListener("touchend", stopDraw);

    function clearRegSignature() {
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      hasSigned = false;
    }

    /* ---------- Submit Form ---------- */
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const alertBox = document.getElementById("reg-alert");
      const submitBtn = document.getElementById("reg-btn");

      if (document.getElementById("reg-website").value) return;

      if (!hasSigned) {
        alertBox.className = "auth-alert error";
        alertBox.innerText = "Signature required. Please sign in the canvas above.";
        return;
      }

      alertBox.className = "auth-alert";
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting Registration...";

      const signatureDataUrl = sigCanvas.toDataURL("image/png");

      const payload = {
        action: "register",
        id: document.getElementById("reg-id").value.trim(),
        name: document.getElementById("reg-name").value.trim(),
        surname: document.getElementById("reg-surname").value.trim(),
        middleName: document.getElementById("reg-mname").value.trim(),
        program: document.getElementById("reg-program").value.trim(),
        sex: document.getElementById("reg-sex").value,
        birthdate: document.getElementById("reg-bdate").value,
        street: document.getElementById("reg-street").value.trim(),
        municipality: document.getElementById("reg-city").value.trim(),
        province: document.getElementById("reg-prov").value.trim(),
        contact: document.getElementById("reg-contact").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        signature: signatureDataUrl
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.ok) {
          const registeredMember = {
            "ID": result.data?.assignedId || payload.id,
            "Student No.": payload.id,
            "Surname": payload.surname,
            "First Name": payload.name,
            "Middle Name": payload.middleName,
            "Program": payload.program,
            "Sex": payload.sex,
            "Birthdate": payload.birthdate,
            "Street / Barangay": payload.street,
            "Municipality / City": payload.municipality,
            "Province": payload.province,
            "Contact Number": payload.contact,
            "E-mail Address": payload.email,
            "Signature": signatureDataUrl,
            "Status": "Active"
          };

          // 1. Send via PeerJS to terminal (if connected)
          if (conn && conn.open) {
            conn.send({ action: "REGISTRATION_COMPLETE", member: registeredMember });
          }

          // 2. Send via BroadcastChannel (same device)
          tapChannel.postMessage({ action: "REGISTRATION_COMPLETE", member: registeredMember });

          // 3. Fallback via LocalStorage
          localStorage.setItem("btled_registration_complete", JSON.stringify(registeredMember));

          alertBox.className = "auth-alert success";
          alertBox.innerText = `Registration successful! Record synced for ${payload.name} ${payload.surname}.`;
          document.getElementById("register-form").reset();
          clearRegSignature();
        } else {
          alertBox.className = "auth-alert error";
          alertBox.innerText = result.error || "Registration failed. Please try again.";
        }
      } catch (err) {
        alertBox.className = "auth-alert error";
        alertBox.innerText = "Network error. Unable to connect to server.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Registration";
      }
    });
  </script>
</body>
</html>
