<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BTLED | Signature Pad</title>
  <link rel="icon" type="image/png" href="../../resources/image/logo/2.png" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #0f172a;
    }
    .pad-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 24px;
      height: 95vh;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column-reverse;
      position: relative;
    }

    /* Fullscreen Button */
    .fs-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #475569;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10;
    }
    .fs-btn:hover { background: #e2e8f0; color: #0f172a; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 99px; font-size: 0.85rem; font-weight: 700; margin-bottom: 16px;
      background: #fee2e2; color: #b91c1c; transition: 0.3s;
    }
    .status-badge.connected { background: #dcfce7; color: #15803d; }
    .status-badge.waiting { background: #fef3c7; color: #b45309; }
    
    h2 { margin: 0 0 4px; font-size: 1.4rem; }
    p { margin: 0 0 16px; color: #64748b; font-size: 0.95rem; }
    
    #idle-screen { padding: 30px 0; }
    #idle-screen i { font-size: 4rem; color: #cbd5e1; display: block; margin-bottom: 10px; }
    
    #draw-screen { display: none; }
    .canvas-wrapper {
      position: relative; width: 100%; background: #ffffff;
      border: 2px dashed #0047AB; border-radius: 10px; touch-action: none; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 220px; background: transparent; cursor: crosshair; }
    
    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn-clear { background: #e2e8f0; color: #475569; }
    .btn-clear:hover { background: #cbd5e1; }
    .btn-submit { background: #0047AB; color: #ffffff; }
    .btn-submit:hover { background: #00337d; }
  </style>
</head>
<body>

  <div class="pad-card">
    <!-- Fullscreen Toggle Button -->
    <button class="fs-btn" id="fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
      <i class="ri-fullscreen-line"></i>
    </button>

    <div id="status" class="status-badge"><i class="ri-loader-4-line ri-spin"></i> Connecting...</div>
    
    <!-- IDLE STATE -->
    <div id="idle-screen">
      <i class="ri-qr-scan-2-line"></i>
      <h2>Waiting for Scan</h2>
      <p>Scan an ID at Terminal 1.<br>The signature pad will unlock automatically.</p>
    </div>

    <!-- DRAWING STATE -->
    <div id="draw-screen">
      <h2>Signature Required</h2>
      <p id="student-name">Student Name</p>

      <div class="canvas-wrapper">
        <canvas id="sig-canvas" width="600" height="300"></canvas>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-clear" onclick="clearSignature()">Clear</button>
        <button type="button" id="send-btn" class="btn btn-submit" onclick="sendSignature()">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const targetPeerId = new URLSearchParams(window.location.search).get("peer");
    const statusEl = document.getElementById("status");
    const idleScreen = document.getElementById("idle-screen");
    const drawScreen = document.getElementById("draw-screen");
    const studentNameEl = document.getElementById("student-name");
    
    const canvas = document.getElementById("sig-canvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false, hasSigned = false;
    let peer = null, conn = null;

    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#0047AB";

    // Setup Peer Connection
    if (targetPeerId) {
      peer = new Peer();
      peer.on("open", () => {
        conn = peer.connect(targetPeerId);

        conn.on("open", () => {
          setStatus("connected", '<i class="ri-link"></i> Linked to Terminal');
        });

        conn.on("data", (data) => {
          if (data && data.action === "REQUEST_SIGNATURE" && data.name) {
            startSigningSession(data.name);
          }
        });

        conn.on("close", () => {
          setStatus("error", '<i class="ri-link-unlink-m"></i> Disconnected');
          resetToIdle();
        });
      });
      peer.on("error", () => setStatus("error", '<i class="ri-error-warning-line"></i> Connection Failed'));
    } else {
      setStatus("error", "No Terminal ID Provided");
    }

    function setStatus(type, html) {
      statusEl.className = "status-badge";
      if (type === "connected") statusEl.classList.add("connected");
      if (type === "waiting") statusEl.classList.add("waiting");
      statusEl.innerHTML = html;
    }

    function startSigningSession(name) {
      studentNameEl.innerText = name;
      idleScreen.style.display = "none";
      drawScreen.style.display = "block";
      clearSignature();
      setStatus("waiting", '<i class="ri-pencil-line"></i> Awaiting Signature');
    }

    function resetToIdle() {
      idleScreen.style.display = "block";
      drawScreen.style.display = "none";
      setStatus("connected", '<i class="ri-link"></i> Linked to Terminal');
    }

    // Touch & Mouse Canvas Handlers
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDraw(e) { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function draw(e) { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function stopDraw() { isDrawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasSigned = false; }

    function sendSignature() {
      if (!hasSigned) return alert("Please draw your signature first.");
      if (!conn || !conn.open) return alert("Lost connection to Terminal 1.");

      const dataUrl = canvas.toDataURL("image/png");
      conn.send({ action: "SIGNATURE_SUBMITTED", signature: dataUrl });
      
      setStatus("connected", '<i class="ri-check-line"></i> Sent!');
      setTimeout(resetToIdle, 1000);
    }

    // Fullscreen Logic
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => console.error("Fullscreen failed:", e));
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const icon = document.querySelector("#fs-btn i");
      if (document.fullscreenElement) {
        icon.className = "ri-fullscreen-exit-line";
      } else {
        icon.className = "ri-fullscreen-line";
      }
    });
  </script>
</body>
</html>
