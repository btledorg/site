<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BTLED | Mobile Scanner</title>
<link rel="icon" type="image/png" href="../../resources/image/logo/2.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" />
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--brand:#0047AB;--ink:#0f172a;--card:#1e293b;--line:#334155}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--ink);color:#fff;font-family:system-ui,sans-serif;text-align:center;touch-action:manipulation}
header{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;img{height:34px}b{font-size:1.05rem}}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;font-weight:700;font-size:.8rem;margin-bottom:10px;
  &.connected{background:#16a34a}&.disconnected{background:#dc2626}&.connecting{background:#d97706}}
.mode{display:flex;gap:6px;max-width:450px;margin:0 auto 10px;button{flex:1}}
#reader{width:100%;max-width:450px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;border:2px solid var(--line)}
.wrap{max-width:450px;margin:8px auto;display:flex;gap:6px}
.in,select{flex:1;width:100%;background:var(--card);color:#fff;border:1px solid var(--line);padding:12px;border-radius:8px;font-weight:600;outline:none}
.btn{background:var(--card);color:#fff;border:1px solid var(--line);padding:12px;border-radius:8px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:center;justify-content:center;
  &.on,&.accent{background:var(--brand);border-color:var(--brand)}&:disabled{opacity:.4}}
#notice{min-height:1.4rem;margin-top:8px;color:#38bdf8;font-weight:600;font-size:.9rem}
#idle{display:none;max-width:450px;margin:30px auto;color:#94a3b8;i{font-size:4rem;display:block}}
.sig-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.96);z-index:99;align-items:center;justify-content:center;padding:14px}
.sig-box{background:#fff;color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:420px;h3{margin:0}p{margin:2px 0 10px;font-size:.8rem;color:#64748b}}
#sig-canvas{width:100%;height:200px;border:2px dashed #cbd5e1;border-radius:10px;background:#f8fafc;touch-action:none}
</style>
</head>
<body>
<header><img src="../../resources/image/logo/2.png" alt="BTLED" /><b>BTLED Mobile</b></header>
<div id="connection-status" class="badge connecting">Connecting…</div>

<div class="mode">
  <button id="m-cam" class="btn on" onclick="setMode('cam')"><i class="ri-camera-line"></i>Camera Scanner</button>
  <button id="m-sig" class="btn" onclick="setMode('sig')"><i class="ri-pen-nib-line"></i>Signature Only</button>
</div>

<div id="cam-area">
  <div id="reader"></div>
  <div class="wrap"><select id="camera-select" onchange="switchCamera(this.value)"><option value="environment">📷 Rear Camera</option><option value="user">🤳 Front Camera</option></select></div>
  <div class="wrap">
    <input id="manual" class="in" placeholder="Student No. / Barcode…" onkeydown="if(event.key==='Enter')manualSend()" />
    <button class="btn accent" onclick="manualSend()"><i class="ri-send-plane-fill"></i></button>
  </div>
  <div class="wrap"><button id="btn-torch" class="btn" style="flex:1" onclick="toggleTorch()" disabled><i class="ri-flashlight-line"></i>Flashlight</button></div>
</div>

<div id="idle"><i class="ri-pen-nib-line"></i><h3>Signature pad ready</h3><p>Scan on the terminal with the barcode scanner. The pad opens here automatically.</p></div>

<div class="wrap" style="justify-content:center"><button class="btn" onclick="initPeer()"><i class="ri-plug-line"></i>Reconnect</button></div>
<div id="notice"></div>

<div id="sig-modal" class="sig-modal"><div class="sig-box">
  <h3 id="sig-name">Signature</h3><p>Sign inside the box to confirm attendance.</p>
  <canvas id="sig-canvas"></canvas>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" style="flex:1;background:#64748b" onclick="clearSig()"><i class="ri-eraser-line"></i>Clear</button>
    <button class="btn" style="flex:1;background:#dc2626" onclick="cancelSig()"><i class="ri-close-line"></i>Cancel</button>
    <button class="btn accent" style="flex:2" onclick="submitSig()"><i class="ri-check-line"></i>Submit</button>
  </div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const targetPeerId = new URLSearchParams(location.search).get("peer");
let peer = null, conn = null, qrScanner = null, camId = "environment", torch = false, cooldown = false, pendingCode = null, hasInk = false;
let queue = JSON.parse(localStorage.getItem("btled_mobile_queue") || "[]");

function beep(f = 880) { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
  o.frequency.value = f; g.gain.value = .2; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .12); } catch {} }
function notice(m) { const e = $("notice"); e.innerText = m; setTimeout(() => { if (e.innerText === m) e.innerText = ""; }, 4000); }
function status(c, t) { const b = $("connection-status"); b.className = "badge " + c; b.innerText = t; }

/* ---------- Connection ---------- */
function initPeer() {
  if (!targetPeerId) return alert("Missing Peer ID. Scan the QR code on Terminal 1.");
  status("connecting", "Connecting…"); if (peer) peer.destroy(); peer = new Peer();
  peer.on("open", () => {
    conn = peer.connect(targetPeerId, { reliable: true });
    conn.on("open", () => { status("connected", "🟢 Connected to Terminal 1"); flush(); });
    conn.on("data", m => {
      if (m.action === "REQUIRE_SIGNATURE") openSig(m.studentNo, m.name);   // from camera OR PC barcode scanner
      else if (m.action === "CLOSE_SIGNATURE") closeSig();
      else if (m.action === "NOT_FOUND") { beep(200); notice(`⚠️ Not registered (${m.studentNo}). Scan the Register QR on the terminal.`); }
      else if (m.action === "DONE") notice("✅ " + m.text);
    });
    conn.on("close", () => status("disconnected", "🔴 Disconnected"));
  });
  peer.on("error", () => status("disconnected", "🔴 Connection error"));
}
function send(p) {
  if (conn && conn.open) conn.send(p);
  else { queue.push(p); localStorage.setItem("btled_mobile_queue", JSON.stringify(queue)); notice("⚠️ Offline. Saved to queue."); }
}
function flush() { if (!queue.length) return; queue.forEach(i => conn.send(i)); queue = []; localStorage.removeItem("btled_mobile_queue"); notice("✅ Queue synced!"); }

/* ---------- Camera scanner ---------- */
async function startCam(sel) {
  const facing = sel === "environment" || sel === "user";
  await qrScanner.start(facing ? { facingMode: sel } : sel,
    { fps: 15, qrbox: { width: 250, height: 180 } }, onScan, () => {});
  try { $("btn-torch").disabled = !qrScanner.getRunningTrackCapabilities().torch; } catch { $("btn-torch").disabled = true; }
}
async function initCam() {
  qrScanner = new Html5Qrcode("reader");
  try { await startCam("environment"); } catch { notice("⚠️ Camera access failed. Check permissions."); return; }
  try { (await Html5Qrcode.getCameras()).forEach((c, i) => { const o = document.createElement("option"); o.value = c.id; o.innerText = c.label || "Camera " + (i + 1); $("camera-select").appendChild(o); }); } catch {}
}
async function switchCamera(v) {
  if (!qrScanner || v === camId) return; camId = v; $("btn-torch").disabled = true; torch = false;
  try { await qrScanner.stop(); await startCam(v); } catch { notice("Failed to switch camera."); }
}
function onScan(text) {
  if (cooldown) return; cooldown = true; beep(); navigator.vibrate && navigator.vibrate(80);
  send({ action: "SCAN_BARCODE", code: text });       // terminal replies with REQUIRE_SIGNATURE if registered
  setTimeout(() => cooldown = false, 2000);
}
function manualSend() { const v = $("manual").value.trim(); if (!v) return; beep(); send({ action: "SCAN_BARCODE", code: v }); notice("📤 Sent: " + v); $("manual").value = ""; }
async function toggleTorch() { torch = !torch; try { await qrScanner.applyVideoConstraints({ advanced: [{ torch }] }); } catch { notice("Flashlight not supported."); } }

/* ---------- Modes ---------- */
async function setMode(m) {
  const cam = m === "cam";
  $("m-cam").classList.toggle("on", cam); $("m-sig").classList.toggle("on", !cam);
  $("cam-area").style.display = cam ? "block" : "none"; $("idle").style.display = cam ? "none" : "block";
  try { if (cam) await startCam(camId); else if (qrScanner && qrScanner.isScanning) await qrScanner.stop(); } catch {}
}

/* ---------- Signature pad ---------- */
const cv = $("sig-canvas"), cx = cv.getContext("2d"); let drawing = false;
function clearSig() { cx.fillStyle = "#f8fafc"; cx.fillRect(0, 0, cv.width, cv.height); cx.strokeStyle = "#0f172a"; cx.lineWidth = 2.5; cx.lineCap = "round"; hasInk = false; }
function openSig(no, name) {
  pendingCode = no; beep(660); navigator.vibrate && navigator.vibrate([60, 40, 60]);
  $("sig-name").innerText = `${name} (${no})`; $("sig-modal").style.display = "flex";
  cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; clearSig();
}
function closeSig() { $("sig-modal").style.display = "none"; pendingCode = null; }
const pos = e => { const r = cv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return { x: p.clientX - r.left, y: p.clientY - r.top }; };
const down = e => { drawing = true; const p = pos(e); cx.beginPath(); cx.moveTo(p.x, p.y); e.preventDefault(); };
const move = e => { if (!drawing) return; const p = pos(e); cx.lineTo(p.x, p.y); cx.stroke(); hasInk = true; e.preventDefault(); };
const up = () => drawing = false;
cv.addEventListener("touchstart", down); cv.addEventListener("touchmove", move); cv.addEventListener("touchend", up);
cv.addEventListener("mousedown", down); cv.addEventListener("mousemove", move); cv.addEventListener("mouseup", up);
function submitSig() {
  if (!hasInk) return notice("✍️ Please sign first.");
  send({ action: "SUBMIT_SIGNATURE", code: pendingCode, signature: cv.toDataURL("image/png") });
  closeSig();
}
function cancelSig() { send({ action: "CANCEL_SIGNATURE" }); closeSig(); }

document.addEventListener("DOMContentLoaded", () => { initPeer(); initCam(); });
</script>
</body>
</html>
