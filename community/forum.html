<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTLED | Community Chat</title>
  <link rel="icon" type="image/png" href="../resources/image/logo/2.png" />
  <link rel="stylesheet" href="../resources/css/landing.css" />
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://btledorg.github.io/">
  <meta property="og:title" content="BTLED Organization | Community Chat">
  <meta property="og:description" content="Connect with fellow BTLED students in our official community chat.">
  <meta property="og:image" content="https://github.com/btledorg/site/blob/main/resources/image/banner/banner.png?raw=true">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BTLED Organization | Community Chat">
  <meta name="twitter:description" content="Official website of the BTLED Industrial Arts Student Organization.">
  <meta name="twitter:image" content="https://github.com/btledorg/site/blob/main/resources/image/banner/banner.png?raw=true">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f9f9f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .chat-main-container {
      flex: 1;
      display: flex;
      width: 100%;
    }

    #chat {
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  
  <!-- Header Navbar -->
  <header class="navbar" id="site-navbar" data-root="../"></header>
  <script src="../resources/js/navbar.js"></script>

  <!-- Full-Screen Chat Section -->
  <main class="chat-main-container">
    <iframe 
      id="chat" 
      src="" 
      allowTransparency="true" 
      allow="microphone; camera; geolocation; display-capture; fullscreen">
    </iframe>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-grid">
      <div class="footer-brand-section">
        <strong class="footer-brand">BTLED Organization</strong>
        <p style="color: #999; font-size: 0.9rem; margin-top: 0.5rem;">
          One of the official student-led organizations at URS Cainta Campus,
          the BTLEd - IA Program Organization.
        </p>
      </div>

      <div class="footer-legal-section">
        <strong style="color:#fff; font-size: 0.95rem; display: block; margin-bottom: 0.5rem;">Legal &amp; Compliance</strong>
        <ul style="list-style: none; padding: 0; margin: 0; font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.35rem;">
          <li><a href="../about/privacy.html" style="color: #999; text-decoration: none;">Privacy Policy</a></li>
          <li><a href="../about/terms.html" style="color: #999; text-decoration: none;">Terms &amp; Conditions</a></li>
          <li><a href="../about/compliance.html" style="color: #999; text-decoration: none;">Data Compliance (RA 10173)</a></li>
          <li><a href="../about/guidelines.html" style="color: #999; text-decoration: none;">Organization Guidelines</a></li>
        </ul>
      </div>

      <div class="footer-right">
        <p style="color: #999; font-size: 0.85rem;">&copy; 2026 BTLED. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Minnit Chat SDK & Auto-Nickname Integration -->
  <script src="https://minnit.chat/js/chatsdk.js?c=1772345196" defer></script>
  <script>
    let minnit;

    document.addEventListener("DOMContentLoaded", function() {
      // Base Minnit Chat embed URL
      let chatUrl = "https://organizations.minnit.chat/180847841454251/c/Main?embed";

      try {
        // Read local storage data (matches your btled_student configuration)
        const studentDataStr = localStorage.getItem("btled_student");
        if (studentDataStr) {
          const student = JSON.parse(studentDataStr);
          
          // Construct name cleanly (e.g., "Espora, Mark Anthony" or fallback to generic name)
          const surname = student.surname || student.Surname || "";
          const firstName = student.name || student["First Name"] || student.firstName || "";
          
          if (surname && firstName) {
            const fullName = `${firstName} ${surname}`.trim(); // Change to `${surname}, ${firstName}` if you prefer last-name first
            chatUrl += `&nickname=${encodeURIComponent(fullName)}`;
          }
        }
      } catch (err) {
        console.warn("Could not load student profile into chat nickname:", err);
      }

      // Dynamically assign the populated URL to the iframe
      const chatIframe = document.getElementById("chat");
      chatIframe.src = chatUrl;

      // Initialize Minnit SDK targeting the iframe #chat
      minnit = new MinnitChat({"iframe": chatIframe});
      minnit.connect();

      minnit.on("messageHistory", function(data) {
        console.log("received new message history:", data);
      });

      minnit.on("message", function(data) {
        console.log("received message:", data);
      });
    });
  </script>
</body>
</html>
